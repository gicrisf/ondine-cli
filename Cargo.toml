[package]
name = "ondine-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
description = "Native command-line renderer for Ondine Mermaid diagrams."

[[bin]]
name = "ondine"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ondine_compiler = { package = "compiler", git = "https://github.com/wevm/ondine", rev = "0b589ec34481856b4153526f10a0a35558a201a8" }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
